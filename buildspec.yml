version: 0.2

phases:
  pre_build:
    commands:
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 994427952146.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=994427952146.dkr.ecr.us-east-1.amazonaws.com/front-angular-foro
      - IMAGE_TAG=latest
  build:
    commands:
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
  post_build:
    commands:
      - docker push $REPOSITORY_URI:$IMAGE_TAG
